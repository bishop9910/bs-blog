# bs-blog backend configuration.
#
# Every key is optional — anything omitted keeps the value baked into
# internal/conf. Paths are resolved relative to the directory the server is
# started from, so the documented invocation is:
#
#   cd backend && go run ./cmd/server

server:
  # Listen address. 127.0.0.1 only accepts connections from this machine;
  # 0.0.0.0 binds every interface so other machines on the LAN can reach it too.
  # Changing this only affects the listener -- the password lock is unchanged.
  addr: "0.0.0.0:8080"
  # How long a request body may take to arrive.
  readTimeout: 60s
  # Kept generous on purpose: image uploads stream through this timeout.
  writeTimeout: 120s
  # Keep-alive window.
  idleTimeout: 120s
  # Hard cap on every request body, uploads included. 32 MiB: an audio upload
  # goes through this filter, and a FLAC album track is easily larger than the
  # 12 MiB an image-only site needed.
  maxBodyBytes: 33554432
  # Where the pages come from. Empty means the frontend embedded in the binary
  # (built by backend/scripts/build-release.ps1) -- the normal setting for a
  # released executable, which needs no dist directory on disk. Set a path to
  # override it, which is handy for iterating on the frontend against a built
  # binary; a path that is missing or has no index.html falls back to the
  # embedded copy. Unknown page paths fall back to index.html so deep links
  # reach the client router. A binary built without a frontend serves the API
  # only.
  staticDir: ""

data:
  # SQLite file. Its parent directory is created when missing.
  database: "data/blog.db"
  # Where uploaded images are written. Public URLs are generated from
  # uploadUrl plus a year/month path, so keep this directory outside version
  # control.
  uploadDir: "data/uploads"
  # URL prefix the uploaded files are served under. Article HTML stores this
  # value verbatim, so changing it breaks links in existing posts.
  uploadUrl: "/uploads"
  # Per-image ceiling. Must stay below server.maxBodyBytes.
  maxUploadBytes: 10485760

site:
  # How many wallpapers the site may keep. The public page picks one at random
  # per visit. 0 is a real setting rather than a missing one: it turns the
  # wallpaper pool off and the default aurora background takes over.
  maxWallpapers: 24
  # Per-wallpaper URL length. Ignored when maxWallpapers is 0. The remaining
  # field limits (title, tagline, socials...) are matched to the column sizes in
  # internal/model and stay code constants; the admin page reads them back from
  # GET /admin/limits.
  maxWallpaperLength: 512

music:
  # Directory scanned for audio files, recursively. It is created by the first
  # upload, so it does not have to exist. Leave the value empty to disable the
  # music library entirely: the routes stay registered and answer with an empty
  # listing instead of failing.
  dir: "data/music"
  # Extensions indexed, without the leading dot. Dropping one here keeps those
  # files out of the listing without deleting anything. An empty list falls back
  # to mp3/flac/m4a/m4b/ogg/opus/wav.
  extensions:
    - "mp3"
    - "flac"
    - "m4a"
    - "m4b"
    - "ogg"
    - "opus"
    - "wav"
  # Rescan a couple of seconds after the directory changes. Handy while copying
  # an album in; turn it off on a network share that floods the filesystem with
  # events.
  watch: true
  # Per-audio-file ceiling for uploads, 32 MiB. Must stay at or below
  # server.maxBodyBytes: the body filter runs first, so a larger value here could
  # never be reached.
  maxUploadBytes: 33554432
  # Largest cover image read from a sidecar .json, 5 MiB. Covers are held in
  # memory only long enough to answer one request, but a sidecar pointing at a
  # huge file would still be read whole.
  maxCoverBytes: 5242880
  # Largest .lrc file read, 1 MiB. Lyrics are a few kilobytes in practice; the
  # cap only stops a mistaken path (a log, a video) from being loaded.
  maxLyricsBytes: 1048576

auth:
  # Optional hex-encoded signing key, at least 32 bytes. Leave empty to use
  # secretFile, which is generated once on first boot and then reused — a fresh
  # key would invalidate every existing login.
  #
  # Keep this empty. This file is tracked by git, so a key written here is a
  # published key: anyone holding a copy of the repository could sign their own
  # admin token and walk straight through the password lock. The generated
  # secretFile lives under data/, which .gitignore keeps out of the repository.
  secret: ""
  secretFile: "data/jwt.secret"
  # How long a login lasts. 7 days.
  tokenTtl: 168h
  # bcrypt work factor. 12 is the sensible default on modern hardware.
  bcryptCost: 12

cors:
  # The Vite dev server runs on another origin, so this is on by default.
  # With the proxy in vite.config.ts, or when staticDir serves the frontend
  # from this same server, CORS is not needed at all.
  enabled: true
  allowedOrigins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

log:
  # "debug" also turns on verbose SQL logging.
  level: "info"
